# Dosya Yolu: .github/workflows/vikunja-copr-ci.yml
# Depo: https://github.com/universish/Vikunja..Copr..CI
# Hedef Fedora Copr: https://copr.fedorainfracloud.org/coprs/universish/Vikunja../

name: Vikunja Fedora Copr CI/CD

on:
  schedule:
    # Vikunja merkezi: Lübeck, Almanya (Europe/Berlin - CET: UTC+1 / CEST: UTC+2)
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Zorunlu paketlenecek sürüm (örn: 2.7.0, boş bırakılırsa otomatik aranır)'
        required: false
        default: ''
      force_release_number:
        description: 'Manuel paketleme numarası (Örn: 2, boş bırakılırsa otomatik hesaplanır)'
        required: false
        default: ''
      force_run:
        description: 'Sürüm zaten paketlenmiş olsa bile 3. aşamayı zorla çalıştır'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  GITHUB_UPSTREAM_REPO: "go-vikunja/vikunja"
  DL_VIKUNJA_DESKTOP_URL: "https://dl.vikunja.io/desktop"
  DL_VIKUNJA_SERVER_URL: "https://dl.vikunja.io/vikunja"
  DL_VIKUNJA_VEANS_URL: "https://dl.vikunja.io/veans"
  COPR_REPO: "universish/Vikunja.."

jobs:
  stage1_github_releases:
    name: "1. Aşama: GitHub Releases RPM Arama"
    runs-on: ubuntu-latest
    outputs:
      new_update: ${{ steps.check_gh.outputs.new_update }}
      version: ${{ steps.check_gh.outputs.version }}
      source_stage: ${{ steps.check_gh.outputs.source_stage }}
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: GitHub Releases Üzerinde 7 RPM Dosyasını Ara
        id: check_gh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VERSION: ${{ inputs.force_version }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          set -euo pipefail
          LAST_VERSION=""
          if [ -f "LAST_VERSION" ]; then
            LAST_VERSION=$(tr -d '[:space:]' < LAST_VERSION)
          fi
          echo "Son paketlenen sürüm: '${LAST_VERSION:-yok}'"

          if [ -n "${FORCE_VERSION}" ]; then
            RAW_TAG="v${FORCE_VERSION#v}"
            RELEASE_JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_UPSTREAM_REPO}/releases/tags/${RAW_TAG}" || echo "{}")
          else
            RELEASE_JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_UPSTREAM_REPO}/releases/latest" || echo "{}")
          fi

          TAG_NAME=$(echo "${RELEASE_JSON}" | jq -r '.tag_name // empty')
          if [ -z "${TAG_NAME}" ]; then
            echo "GitHub Releases üzerinden sürüm etiketi alınamadı. 2. aşamaya geçiliyor."
            echo "new_update=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "source_stage=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG_NAME#v}"
          echo "GitHub Releases üzerinde bulunan son sürüm: v${VERSION}"

          if [ "${VERSION}" = "${LAST_VERSION}" ] && [ "${FORCE_RUN}" != "true" ]; then
            echo "v${VERSION} sürümü zaten paketlenmiş. dl.vikunja.io kontrolü için 2. aşamaya geçiliyor."
            echo "new_update=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source_stage=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASSETS_LIST=$(echo "${RELEASE_JSON}" | jq -r '.assets[].name // empty')
          MISSING=0
          REQUIRED_RPMS=(
            "vikunja-v${VERSION}-x86_64.rpm"
            "vikunja-v${VERSION}-armv7.rpm"
            "vikunja-v${VERSION}-aarch64.rpm"
            "veans-v${VERSION}-x86_64.rpm"
            "veans-v${VERSION}-armv7.rpm"
            "veans-v${VERSION}-aarch64.rpm"
          )

          for rpm_file in "${REQUIRED_RPMS[@]}"; do
            if ! echo "${ASSETS_LIST}" | grep -Fxq "${rpm_file}"; then
              echo "Eksik dosya: ${rpm_file}"
              MISSING=1
            fi
          done

          if echo "${ASSETS_LIST}" | grep -Fxq "Vikunja Desktop-v${VERSION}.rpm" || \
             echo "${ASSETS_LIST}" | grep -Fxq "Vikunja.Desktop-v${VERSION}.rpm"; then
            echo "Vikunja Desktop bulundu."
          else
            MISSING=1
          fi

          if [ "${MISSING}" -eq 0 ]; then
            echo "Tüm RPM dosyaları tamam! 3. aşamaya geçiliyor."
            echo "new_update=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source_stage=stage1" >> "$GITHUB_OUTPUT"
          else
            echo "1. Aşamada eksik dosyalar var. 2. Aşamaya geçiliyor."
            echo "new_update=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source_stage=none" >> "$GITHUB_OUTPUT"
          fi

  stage2_dl_vikunja:
    name: "2. Aşama: dl.vikunja.io/desktop/vX.Y.Z Kontrolü"
    needs: stage1_github_releases
    if: needs.stage1_github_releases.outputs.new_update != 'true'
    runs-on: ubuntu-latest
    outputs:
      new_update: ${{ steps.check_dl.outputs.new_update }}
      version: ${{ steps.check_dl.outputs.version }}
      source_stage: ${{ steps.check_dl.outputs.source_stage }}
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: dl.vikunja.io/desktop/vX.Y.Z/ Adresinde RPM Ara
        id: check_dl
        env:
          FORCE_VERSION: ${{ inputs.force_version }}
          FORCE_RUN: ${{ inputs.force_run }}
          STAGE1_VERSION: ${{ needs.stage1_github_releases.outputs.version }}
        run: |
          set -euo pipefail
          LAST_VERSION=""
          if [ -f "LAST_VERSION" ]; then
            LAST_VERSION=$(tr -d '[:space:]' < LAST_VERSION)
          fi

          if [ -n "${FORCE_VERSION}" ]; then
            VERSION="${FORCE_VERSION#v}"
          else
            INDEX_HTML=$(curl -fsSL "${DL_VIKUNJA_DESKTOP_URL}/")
            VERSION=$(echo "${INDEX_HTML}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^v//' | sort -V | tail -n 1 || true)
            if [ -z "${VERSION}" ] && [ -n "${STAGE1_VERSION}" ]; then
              VERSION="${STAGE1_VERSION}"
            fi
          fi

          if [ -z "${VERSION}" ]; then
            echo "new_update=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "source_stage=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${VERSION}" = "${LAST_VERSION}" ] && [ "${FORCE_RUN}" != "true" ]; then
            echo "v${VERSION} zaten paketlenmiş durumda."
            echo "new_update=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source_stage=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DESKTOP_RPM_URL="${DL_VIKUNJA_DESKTOP_URL}/v${VERSION}/Vikunja%20Desktop-v${VERSION}.rpm"
          if curl -fsSLI "${DESKTOP_RPM_URL}" >/dev/null 2>&1; then
            echo "Vikunja Desktop-v${VERSION}.rpm mevcut! 3. aşamaya geçiliyor."
            echo "new_update=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source_stage=stage2" >> "$GITHUB_OUTPUT"
          else
            echo "new_update=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source_stage=none" >> "$GITHUB_OUTPUT"
          fi

  stage3_repackage_and_publish:
    name: "3. Aşama: RPM Açma, Paketleme ve Copr Yayınlama"
    needs: [stage1_github_releases, stage2_dl_vikunja]
    if: |
      always() && (
        needs.stage1_github_releases.outputs.new_update == 'true' ||
        needs.stage2_dl_vikunja.outputs.new_update == 'true'
      )
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Git Paketini Kur
        run: dnf install -y git

      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Araçları Kur
        run: |
          dnf install -y rpm-build rpmdevtools cpio copr-cli curl jq git tar gzip findutils sed coreutils

      - name: Fedora Copr API Kimlik Bilgilerini Yapılandır
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf "%s\n" "${COPR_CONFIG}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Paketleme Numarasını Hesapla ve Yayınla
        id: build_copr
        env:
          VERSION: ${{ needs.stage1_github_releases.outputs.new_update == 'true' && needs.stage1_github_releases.outputs.version || needs.stage2_dl_vikunja.outputs.version }}
          SOURCE_STAGE: ${{ needs.stage1_github_releases.outputs.new_update == 'true' && 'stage1' || 'stage2' }}
          FORCE_RELEASE: ${{ inputs.force_release_number }}
        run: |
          set -euo pipefail

          LAST_VERSION_FILE=""
          if [ -f "LAST_VERSION" ]; then
            LAST_VERSION_FILE=$(tr -d '[:space:]' < LAST_VERSION || true)
          fi

          if [ -n "${FORCE_RELEASE}" ] && [[ "${FORCE_RELEASE}" =~ ^[0-9]+$ ]]; then
            NEXT_RELEASE="${FORCE_RELEASE}"
            echo "Kullanıcı tarafından manuel paketleme numarası belirtildi: ${NEXT_RELEASE}"
          elif [ "${VERSION}" != "${LAST_VERSION_FILE}" ]; then
            # Sürüm değiştiyse numarayı 1'den başlat
            NEXT_RELEASE=1
            echo "Yeni sürüm tespit edildi. Paket numarası 1'e sıfırlandı."
          else
            # Aynı sürüm paketleniyorsa numarayı +1 artır
            CURRENT_RELEASE=0
            if [ -f "RELEASE_NUMBER" ]; then
              RAW_REL=$(tr -d '[:space:]' < RELEASE_NUMBER || echo "0")
              if [[ "${RAW_REL}" =~ ^[0-9]+$ ]]; then CURRENT_RELEASE="${RAW_REL}"; fi
            fi
            NEXT_RELEASE=$((CURRENT_RELEASE + 1))
            echo "Aynı sürüm yenileniyor. Numara artırıldı: ${CURRENT_RELEASE} -> ${NEXT_RELEASE}"
          fi

          echo "Paket formatı: vikunja-v${VERSION}-${NEXT_RELEASE}"

          chmod +x scripts/repackage_and_publish.sh
          ./scripts/repackage_and_publish.sh "${VERSION}" "${SOURCE_STAGE}" "${NEXT_RELEASE}"

          echo "${VERSION}" > LAST_VERSION
          echo "${NEXT_RELEASE}" > RELEASE_NUMBER
          echo "release_number=${NEXT_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Paketlenen Sürümü Depoya Kaydet
        env:
          VERSION: ${{ needs.stage1_github_releases.outputs.new_update == 'true' && needs.stage1_github_releases.outputs.version || needs.stage2_dl_vikunja.outputs.version }}
          RELEASE_NUM: ${{ steps.build_copr.outputs.release_number }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_VERSION RELEASE_NUMBER
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): vikunja-v${VERSION}-${RELEASE_NUM} Copr üzerinde yayınlandı"
            git push
          fi
